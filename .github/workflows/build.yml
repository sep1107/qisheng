name: Validate Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test optional Markdown receiver
        run: python3 -m unittest discover -s receiver -p 'test_*.py' -v
      - uses: android-actions/setup-android@v3
      - run: ./gradlew testDebugUnitTest assembleDebug lintDebug --no-daemon
      # CI's disposable debug signing key is NOT the recorder's update signing key.
      # Publish an APK only after signing with the original installation key.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
